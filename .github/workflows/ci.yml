name: AegisMesh VPN CI/CD & Android APK Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-test:
    name: Typecheck, Unit Tests & Web/Desktop Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build frontend and backend
        run: npm run build

  build-android-apk:
    name: Build Signed Android APK (sing-box + hev-socks5-tunnel)
    runs-on: ubuntu-latest
    needs: verify-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache sing-box Android arm64 binary
        uses: actions/cache@v4
        with:
          path: android/app/src/main/jniLibs/arm64-v8a/libsingbox.so
          key: singbox-android-arm64-v1.14.4

      - name: Install dependencies
        run: npm ci

      - name: Ensure sing-box Android native library
        run: npm run ensure:singbox-android

      - name: Build web assets & sync Capacitor Android
        run: |
          npm run build
          npx cap sync android

      - name: Assemble signed Android APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Package AegisMesh-VPN.apk & compute SHA-256
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk AegisMesh-VPN.apk
          sha256sum AegisMesh-VPN.apk > AegisMesh-VPN.apk.sha256
          ls -lh AegisMesh-VPN.apk AegisMesh-VPN.apk.sha256
          cat AegisMesh-VPN.apk.sha256

      - name: Upload APK & SHA-256 as GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AegisMesh-VPN-Android-APK
          path: |
            AegisMesh-VPN.apk
            AegisMesh-VPN.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Release (Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            AegisMesh-VPN.apk
            AegisMesh-VPN.apk.sha256
          generate_release_notes: true

      - name: Sync APK Asset to Latest GitHub Release (Main Branch Push)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PKG_VER="v$(node -p "require('./package.json').version")"
          if gh release view "$PKG_VER" >/dev/null 2>&1; then
            echo "Uploading AegisMesh-VPN.apk to existing release $PKG_VER..."
            gh release upload "$PKG_VER" AegisMesh-VPN.apk AegisMesh-VPN.apk.sha256 --clobber
          else
            echo "Creating new latest release $PKG_VER with AegisMesh-VPN.apk..."
            gh release create "$PKG_VER" AegisMesh-VPN.apk AegisMesh-VPN.apk.sha256 \
              --title "🛡️ AegisMesh VPN $PKG_VER (In-App Updater + Anti-DPI + 20 Test Suites)" \
              --notes "Автоматическая сборка **AegisMesh VPN $PKG_VER** (\`versionCode 9\`) с встроенным автообновлением из GitHub Releases, анти-DPI защитой (\`uTLS Chrome\`, \`xudp\`, \`Port Hopping\`), защитой голосовых WebRTC/STUN сессий ИИ и 20 боевыми тестовыми наборами." \
              --latest
          fi

